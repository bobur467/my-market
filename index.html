<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RQB Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #f0ede6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding-bottom: 70px; }
.header { background: #0a0a0a; padding: 16px; text-align: center; border-bottom: 1px solid #1f1f1f; position: sticky; top: 0; z-index: 100; }
.header h1 { color: #c9a84c; font-size: 22px; letter-spacing: 2px; }
.header p { font-size: 11px; color: #666; margin-top: 4px; }
.tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f0f; border-top: 1px solid #1f1f1f; z-index: 100; }
.tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: none; border: none; color: #666; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.tab.active { color: #c9a84c; background: #1a1a1a; }
.page { display: none; padding: 16px; min-height: 100vh; }
.page.active { display: block; }
.form-group { margin-bottom: 16px; }
label { display: block; margin-bottom: 6px; font-size: 12px; color: #c9a84c; font-weight: 500; }
input, textarea, select { width: 100%; padding: 14px; background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; color: #f0ede6; font-size: 14px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #c9a84c; }
button { background: #c9a84c; color: #0a0a0a; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
.card { background: #111111; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
.category-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; margin-bottom: 8px; }
.category-badge.instagram { background: #e1306c20; color: #e1306c; border: 1px solid #e1306c30; }
.category-badge.telegram { background: #2aabee20; color: #2aabee; border: 1px solid #2aabee30; }
.card-price { font-size: 20px; font-weight: bold; color: #c9a84c; margin: 8px 0; }
.status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; margin-top: 8px; }
.status-pending { background: #ffaa0020; color: #ffaa00; }
.filter-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
.filter-btn { padding: 8px 20px; background: #141414; border: 1px solid #2a2a2a; border-radius: 30px; font-size: 13px; color: #888; white-space: nowrap; cursor: pointer; }
.filter-btn.active { background: #c9a84c; color: #0a0a0a; }
#image-upload-container { border: 2px dashed #2a2a2a; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
#image-upload-container.has-image { border-color: #c9a84c; border-style: solid; }
#image-preview { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
#upload-placeholder { transition: all 0.2s; }
</style>
</head>
<body>

<div class="header">
    <h1>🏆 RQB MARKET</h1>
    <p>Instagram | Telegram akkauntlar savdosi</p>
</div>

<!-- BOZOR SAHIFASI -->
<div id="market-page" class="page active">
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">🏠 Hammasi</button>
        <button class="filter-btn" data-filter="instagram">📸 Instagram</button>
        <button class="filter-btn" data-filter="telegram">✈️ Telegram</button>
    </div>
    <div id="ads-list"></div>
</div>

<!-- E'LON QO'SHISH SAHIFASI -->
<div id="add-page" class="page">
    <div class="form-group">
        <label>📂 Kategoriya</label>
        <select id="category">
            <option value="instagram">📸 Instagram akkaunt</option>
            <option value="telegram">✈️ Telegram akkaunt</option>
        </select>
    </div>
    <div class="form-group">
        <label>📸 Akkaunt skrinshoti *</label>
        <div id="image-upload-container" onclick="document.getElementById('photo-input').click()">
            <input type="file" id="photo-input" accept="image/*" style="display: none;">
            <div id="upload-placeholder">
                <span style="font-size: 32px;">🖼️</span>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">Rasm tanlash uchun bosing</p>
            </div>
            <img id="image-preview" src="">
        </div>
    </div>
    <div class="form-group">
        <label>👤 Username *</label>
        <input type="text" id="username" placeholder="Masalan: @example_uz">
    </div>
    <div class="form-group">
        <label>💰 Narxi *</label>
        <input type="text" id="price" placeholder="Masalan: $500">
    </div>
    <div class="form-group">
        <label>📝 Tavsif</label>
        <textarea id="description" rows="3" placeholder="Obunachilar soni, niche..."></textarea>
    </div>
    <div class="form-group">
        <label>📞 Telefon raqam *</label>
        <input type="tel" id="phone" placeholder="+998 90 123 45 67">
    </div>
    <div class="form-group">
        <label>💬 Telegram username *</label>
        <input type="text" id="contact_tg" placeholder="@username">
    </div>
    <button id="submit-ad-btn">🚀 E'lon qoldirish</button>
    <div style="height: 20px;"></div>
</div>

<!-- PROFIL SAHIFASI -->
<div id="profile-page" class="page">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 48px;">👤</div>
        <div id="profile-name" style="font-size: 18px; font-weight: bold;">Foydalanuvchi</div>
        <div id="profile-id" style="font-size: 11px; color: #888;"></div>
    </div>
    <div id="my-ads-list"></div>
</div>

<!-- NAVIGATION -->
<div class="tabs">
    <button class="tab active" data-page="market">🏠 Bozor</button>
    <button class="tab" data-page="add">➕ E'lon berish</button>
    <button class="tab" data-page="profile">👤 Profilim</button>
</div>

<script>
// Telegram WebApp
const tg = window.Telegram.WebApp;
tg.expand();

// Global variables
let selectedPhotoBase64 = null;
let currentFilter = 'all';

// ============ RASM PREVIEW ============
const photoInput = document.getElementById('photo-input');
const uploadContainer = document.getElementById('image-upload-container');
const uploadPlaceholder = document.getElementById('upload-placeholder');
const imagePreview = document.getElementById('image-preview');

photoInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(evt) {
        selectedPhotoBase64 = evt.target.result;
        imagePreview.src = selectedPhotoBase64;
        imagePreview.style.display = 'block';
        uploadPlaceholder.style.display = 'none';
        uploadContainer.classList.add('has-image');
        
        // Test qilish uchun console.log
        console.log('✅ Rasm yuklandi, length:', selectedPhotoBase64.length);
    };
    reader.readAsDataURL(file);
});

// ============ E'LON QOLDIRISH ============
async function submitAd() {
    const category = document.getElementById('category').value;
    const title = document.getElementById('username').value.trim();
    const price = document.getElementById('price').value.trim();
    const description = document.getElementById('description').value.trim();
    const phone = document.getElementById('phone').value.trim();
    let contact_tg = document.getElementById('contact_tg').value.trim();
    
    // Username dan @ ni tozalash
    contact_tg = contact_tg.replace('@', '');
    
    // Tekshirish
    if (!title) {
        tg.showAlert('❌ Username ni kiriting!');
        return;
    }
    if (!price) {
        tg.showAlert('❌ Narxni kiriting!');
        return;
    }
    if (!phone) {
        tg.showAlert('❌ Telefon raqamni kiriting!');
        return;
    }
    if (!contact_tg) {
        tg.showAlert('❌ Telegram username ni kiriting!');
        return;
    }
    if (!selectedPhotoBase64) {
        tg.showAlert('❌ Iltimos, rasm yuklang!');
        return;
    }
    
    // Base64 dan "data:image/..." qismini olib tashlash (faqat base64 string)
    let base64String = selectedPhotoBase64;
    if (base64String.includes(',')) {
        base64String = base64String.split(',')[1];
    }
    
    const user = tg.initDataUnsafe?.user;
    const adData = {
        action: 'new_ad',
        category: category,
        title: title,
        price: price,
        description: description,
        phone: phone,
        contact_tg: contact_tg,
        photo_b64: base64String,
        photo_mime: 'image/jpeg'
    };
    
    // LocalStorage ga saqlash (faqat ko'rinish uchun)
    const ads = JSON.parse(localStorage.getItem('rqb_ads') || '[]');
    ads.unshift({
        id: Date.now(),
        user_id: user?.id || 0,
        category: category,
        title: title,
        price: price,
        description: description,
        status: 'pending'
    });
    localStorage.setItem('rqb_ads', JSON.stringify(ads));
    
    console.log('📤 Yuborilmoqda:', adData);
    
    // Botga yuborish
    tg.sendData(JSON.stringify(adData));
    
    tg.showAlert('✅ E\'loningiz yuborildi!\nAdmin tekshirgandan so\'ng chiqariladi.');
    
    // Formani tozalash
    document.getElementById('username').value = '';
    document.getElementById('price').value = '';
    document.getElementById('description').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('contact_tg').value = '';
    selectedPhotoBase64 = null;
    imagePreview.style.display = 'none';
    uploadPlaceholder.style.display = 'flex';
    uploadContainer.classList.remove('has-image');
    
    // Bozor sahifasiga o'tish
    switchPage('market');
    renderMarket();
    renderProfile();
}

// ============ SAHIFALARNI ALMASHTIRISH ============
function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`${page}-page`).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-page="${page}"]`).classList.add('active');
    
    if (page === 'market') renderMarket();
    if (page === 'profile') renderProfile();
}

// ============ BOZORNI RENDER QILISH ============
function renderMarket() {
    const ads = JSON.parse(localStorage.getItem('rqb_ads') || '[]');
    const approved = ads.filter(ad => ad.status === 'approved');
    const filtered = currentFilter === 'all' ? approved : approved.filter(ad => ad.category === currentFilter);
    const container = document.getElementById('ads-list');
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">📭 Hozircha e\'lonlar yo\'q</div>';
        return;
    }
    
    container.innerHTML = filtered.map(ad => `
        <div class="card">
            <span class="category-badge ${ad.category}">${ad.category === 'instagram' ? '📸 Instagram' : '✈️ Telegram'}</span>
            <div style="font-weight:bold;">${escapeHtml(ad.title)}</div>
            <div class="card-price">💰 ${escapeHtml(ad.price)}</div>
            ${ad.description ? `<div style="font-size:12px; color:#888;">📝 ${escapeHtml(ad.description)}</div>` : ''}
        </div>
    `).join('');
}

// ============ PROFILNI RENDER QILISH ============
function renderProfile() {
    const ads = JSON.parse(localStorage.getItem('rqb_ads') || '[]');
    const user = tg.initDataUnsafe?.user;
    const myAds = ads.filter(ad => ad.user_id === (user?.id || 0));
    const container = document.getElementById('my-ads-list');
    
    if (myAds.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">📋 Sizda e\'lonlar yo\'q</div>';
        return;
    }
    
    container.innerHTML = myAds.map(ad => `
        <div class="card">
            <span class="category-badge ${ad.category}">${ad.category === 'instagram' ? '📸 Instagram' : '✈️ Telegram'}</span>
            <div style="font-weight:bold;">${escapeHtml(ad.title)}</div>
            <div class="card-price">💰 ${escapeHtml(ad.price)}</div>
            <div class="status-badge status-pending">⏳ ${ad.status === 'pending' ? 'Admin tekshirmoqda' : ad.status}</div>
        </div>
    `).join('');
}

// ============ HTML ESCAPE ============
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ FILTER ============
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderMarket();
    });
});

// ============ TABLAR ============
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchPage(tab.dataset.page));
});

// ============ E'LON QOLDIRISH TUGMASI ============
document.getElementById('submit-ad-btn').addEventListener('click', submitAd);

// ============ PROFIL MA'LUMOTLARI ============
if (tg.initDataUnsafe?.user) {
    const user = tg.initDataUnsafe.user;
    document.getElementById('profile-name').textContent = user.first_name || 'Foydalanuvchi';
    document.getElementById('profile-id').textContent = 'ID: ' + user.id;
}

// ============ BOSHLASH ============
renderMarket();

// Telegram ready
tg.ready();

console.log('🚀 RQB MARKET ishga tushdi!');
</script>
</body>
</html>
