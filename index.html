<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uzlevl Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --accent: #d4af37; /* Uzlevl Gold */
            --btn: var(--tg-theme-button-color, #248b65);
            --sec: var(--tg-theme-secondary-bg-color, #f5f5f5);
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; transition: 0.3s; }
        .page { display: none; padding: 20px; }
        .active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--accent); margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; color: var(--accent); }

        .card { background: var(--sec); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.05); }
        .price { color: var(--btn); font-weight: bold; font-size: 18px; }
        
        .nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--sec); display: flex; border-top: 1px solid rgba(0,0,0,0.1); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; opacity: 0.6; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); border-top: 3px solid var(--accent); }

        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; background: var(--bg); color: var(--text); box-sizing: border-box; }
        .main-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="market" class="page active">
    <div class="header"><h1>UZLEVL MARKET</h1></div>
    <div class="card">
        <h3>@baratov.uzs</h3>
        <p>Instagram premium account</p>
        <div class="price">850,000 UZS</div>
        <button class="main-btn" style="background: var(--btn); color: #fff;" onclick="buy('baratov.uzs')">Sotib olish</button>
    </div>
</div>

<div id="add" class="page">
    <h2>Yangi e'lon</h2>
    <input type="text" id="t" placeholder="Nomi (masalan: @username)">
    <input type="number" id="p" placeholder="Narxi (UZS)">
    <textarea id="d" rows="5" placeholder="Tavsif va aloqa ma'lumotlari..."></textarea>
    <button class="main-btn" onclick="send()">E'lonni yuborish</button>
</div>

<div id="profile" class="page">
    <h2>Profilim</h2>
    <div class="card" style="text-align:center">
        <h3 id="un">Yuklanmoqda...</h3>
        <p id="ui"></p>
        <hr>
        <p>Mening e'lonlarim: 0</p>
    </div>
</div>

<div class="nav">
    <div class="nav-item active-nav" onclick="tab('market', this)"><span>🛒 Bozor</span></div>
    <div class="nav-item" onclick="tab('add', this)"><span>➕ E'lon</span></div>
    <div class="nav-item" onclick="tab('profile', this)"><span>👤 Profil</span></div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    document.getElementById('un').innerText = tg.initDataUnsafe.user.first_name;
    document.getElementById('ui').innerText = "ID: " + tg.initDataUnsafe.user.id;

    function tab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        el.classList.add('active-nav');
    }

    function send() {
        let t = document.getElementById('t').value;
        let p = document.getElementById('p').value;
        let d = document.getElementById('d').value;
        if(!t || !p) return tg.showAlert("Ma'lumotlarni to'ldiring!");
        
        tg.showConfirm("E'lonni tasdiqlash uchun yuborasizmi?", (ok) => {
            if(ok) {
                tg.sendData(JSON.stringify({action:"new_ad", title:t, price:p, description:d}));
            }
        });
    }

    function buy(item) {
        tg.showAlert(item + " bo'yicha so'rovingiz qabul qilindi. Tez orada sotuvchi aloqaga chiqadi.");
    }
</script>
</body>
</html>
